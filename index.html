<!doctype html>
<html>
  <head>
    <title>aditya mukherjee</title>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="./css/colors.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: var(--text);
      }

      .page {
        container-type: inline-size;
        box-sizing: border-box;
        display: grid;
        grid-template-rows: auto 1fr auto;
        width: min(520px, 100%);
        aspect-ratio: 3 / 4;
        padding: 40px 36px;
      }

      .links {
        display: flex;
        justify-content: flex-end;
        gap: 6cqw;
      }

      .links a {
        padding: 2px 6px;
        color: var(--accent);
        font-size: clamp(13px, 3.6cqw, 14px);
        text-decoration: none;
      }

      .page a {
        white-space: nowrap;
        background: linear-gradient(var(--accent), var(--accent)) no-repeat 0
          0 / 0% 100%;
        transition:
          background-size 0.3s,
          color 0.3s;
      }

      .hero {
        display: grid;
        place-items: center;
      }

      .hero > * {
        grid-area: 1 / 1;
      }

      .seal {
        width: 44cqw;
      }

      .seal img {
        display: block;
        width: 100%;
        filter: url(#redprint);
      }

      .name {
        position: relative;
        margin: 0;
        font-size: 10cqw;
        font-weight: 600;
        white-space: nowrap;
        line-height: 1.05;
        text-align: center;
      }

      .foreword {
        font-size: clamp(13px, 4.4cqw, 16px);
        line-height: 1.7;
      }

      .foreword p {
        margin: 0 0 0.8em;
      }

      .foreword p:last-child {
        margin-bottom: 0;
      }

      .foreword a {
        color: inherit;
        text-decoration: underline var(--accent);
        text-underline-offset: 3px;
      }

      .foreword a.hl {
        color: var(--accent);
      }

      .page a:hover {
        color: var(--background);
        background-size: 100% 100%;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <filter id="redprint" color-interpolation-filters="sRGB">
        <feColorMatrix
          values="0 0 0 0 .992  0 0 0 0 .263  0 0 0 0 0  -.9 -1.6 -.5 0 2.2"
          result="tint"
        />
        <feComposite in="tint" in2="SourceAlpha" operator="in" />
      </filter>
    </svg>

    <main class="page">
      <div class="foreword">
        <p>
          20 years of experience building products through engineering
          and&nbsp;leadership.
        </p>
        <p>
          previously at
          <a href="https://dovetail.com" rel="nofollow">dovetail</a>,
          <a href="https://unikrn.com/" rel="nofollow">unikrn</a>,
          <a
            href="https://www.crunchbase.com/organization/atticous"
            rel="nofollow"
            >atticous</a
          >, and
          <a
            href="https://www.geekwire.com/2015/seattle-esports-wagering-company-unikrn-acquires-dotaprohub/"
            rel="nofollow"
            >dotaprohub</a
          >.
        </p>
        <p>
          <a href="mailto:hello@adityamukherjee.com" class="hl">let's talk</a>
          about working&nbsp;together.
        </p>
      </div>

      <div class="hero">
        <div class="seal"><img src="./assets/S.png" alt="" /></div>
        <h1 class="name">aditya mukherjee</h1>
      </div>

      <nav class="links">
        <a href="./writing/">writing</a>
        <a href="https://github.com/adityavm" rel="nofollow noreferrer"
          >github</a
        >
        <a href="./resume.html">resume</a>
      </nav>
    </main>
  </body>
</html>
