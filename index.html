<html>
  <head>
    <title>aditya mukherjee</title>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="./css/colors.css" rel="stylesheet" />
    <style>
      body {
        padding: 0;
        margin: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 15px;
        background-color: var(--background);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
      }

      .container {
        display: flex;
        margin: 40px 20px;
        border: 3px solid var(--text);
        box-shadow: 10px 10px 0 var(--accent);
      }

      @media (max-width: 1024px) {
        .container {
          flex-direction: column;
          max-width: 400px;
        }
      }

      .card {
        width: 300px;
        padding: 32px 24px;
        text-align: center;
        border-right: 3px solid var(--text);
      }

      @media (max-width: 1024px) {
        .card {
          width: auto;
          border-right: none;
          border-bottom: 3px solid var(--text);
        }
      }

      .name {
        margin: 16px 0 12px;
        font-size: 18px;
        font-weight: 700;
      }

      .divider {
        color: var(--text-dimmest);
        margin: 0 4px;
      }

      img {
        width: 250px;
        max-width: 100%;
        height: 230px;
        display: block;
        margin: 0 auto;
        object-fit: cover;
      }

      a {
        color: var(--text);
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
        text-decoration-skip-ink: none;
        white-space: nowrap;
      }

      .card a {
        color: var(--accent);
      }

      a:hover {
        color: var(--background);
        background-color: var(--accent);
        text-decoration: none;
      }

      .foreword {
        display: flex;
        align-items: center;
        max-width: 340px;
        padding: 48px;
        line-height: 1.6;
      }

      @media (max-width: 1024px) {
        .foreword {
          padding: 32px 28px;
        }
      }

      .foreword a.hl {
        color: var(--background);
        background-color: var(--accent);
        padding: 2px 6px;
        text-decoration: none;
      }

      @media (min-width: 375px) {
        .shy {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div>
          <img src="./assets/S.png" />
          <div class="name">aditya mukherjee</div>
          <a href="https://twitter.com/aditya" rel="nofollow noreferrer"
            >twitter</a
          >
          <span class="divider">/</span>
          <a href="https://github.com/adityavm" rel="nofollow noreferrer"
            >github</a
          >
          <span class="divider">/</span>
          <a href="./resume.html">resume</a>
        </div>
      </div>
      <div class="foreword">
        <div class="content">
          <p>
            15 years of experience building products through engineering
            and&nbsp;leadership.
          </p>
          <p>
            previously at <a href="https://dovetail.com" rel="nofollow">dovetail</a>, 
            <a href="https://unikrn.com/" rel="nofollow">unikrn</a>,
            <a
              href="https://www.crunchbase.com/organization/atticous"
              rel="nofollow"
              >atticous</a
            >, and
            <a
              href="https://www.geekwire.com/2015/seattle-esports-wagering-company-unikrn-acquires-dotaprohub/"
              rel="nofollow"
              >dotaprohub</a
            >. <span class="shy"><br /></span
            ><a href="mailto:hello@adityamukherjee.com" class="hl"
              >let's talk</a
            >
            about working&nbsp;together.
          </p>
        </div>
      </div>
    </div>
    <script></script>
  </body>
</html>
